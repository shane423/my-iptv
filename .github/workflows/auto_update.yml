name: 自動更新 IPTV 播放清單

on:
  schedule:
    # 台北時間 (GMT+8) 早上 05:12，對應 UTC 時間為前一天晚上的 21:12
    - cron: '12 21 * * *'
  workflow_dispatch: # 保留手動點擊按鈕強制執行更新的功能

# 強制賦予工作流最高層級的寫入權限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 簽出專案原始碼
      - name: 簽出專案原始碼 (Checkout Repository)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # 2. 設定 Python 環境
      - name: 設定 Python 環境 (Set up Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安裝 Python 必要套件
      - name: 安裝 Python 活網偵測必要套件 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      # 4. 執行 Python 腳本
      - name: 執行智慧清洗與雙軌精簡偵測腳本 (Run Script)
        run: python merge_iptv.py

      # 5. 提交並推送最新 M3U 直播源 (不論有無變動都強制推送)
      - name: 提交並推送最新 M3U 直批源 (Commit and Push changes)
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          
          # 將產生的檔案加入暫存區
          git add taiwan_live.m3u
          
          # 允許空提交，確保每次執行都會強制推送到主分支
          git commit --allow-empty -m "自動同步：強制更新台灣雙軌活網精簡直播源 [$(date '+%Y-%m-%d %H:%M:%S')]"
          
          # 安全推送回主分支
          git push origin HEAD:${{ github.ref_name }}

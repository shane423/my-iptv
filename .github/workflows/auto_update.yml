      # 5. 提交並推送最新 M3U 直播源（💡最標準、安全的推送方式）
      - name: 提交並推送最新 M3U 直播源 (Commit and Push changes)
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add taiwan_live.m3u
          
          # 檢查是否有檔案變動，避免無變動時提交報錯中斷
          if ! git diff --quiet && ! git diff --staged --quiet; then
            git commit -m "自動同步：更新台灣雙軌活網精簡直播源 [$(date '+%Y-%m-%d %H:%M:%S')]"
            
            # 💡 簡化為標準指令，GitHub 會自動帶入簽出時的 token
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "直播源無任何變動，跳過本次推送。"
          fi
